name: Docker CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  audit-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker compose -f docker/docker-compose.yml build

      - name: Run Raglemetry audit scan
        run: |
          docker compose -f docker/docker-compose.yml run --rm raglemetry \
            --log-path mock/app.log \
            --alert "502 Bad Gateway" \
            --sha "a8f9c2d" \
            --fingerprint "FP_ERR_504"

      - name: Verify generated audit trace output
        run: |
          test -f output/audit_trace.json
          cat output/audit_trace.json